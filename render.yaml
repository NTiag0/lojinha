services:
  - type: web
    name: lojinha
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py --host 0.0.0.0
    healthCheckPath: /healthz
    envVars:
      - key: LOJINHA_MODE
        value: production
      - key: LOJINHA_REQUIRE_POSTGRES
        value: "1"
      - key: LOJINHA_DATABASE_URL
        sync: false
      - key: TZ
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: LOJINHA_ADMIN_USER
        value: tiago
      - key: LOJINHA_ADMIN_PASSWORD_HASH
        sync: false

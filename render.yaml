services:
  - type: web
    name: lojinha
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q server.py security.py
    startCommand: python -u server.py --host 0.0.0.0
    healthCheckPath: /healthz
    disk:
      name: lojinha-data
      mountPath: /var/data/lojinha
      sizeGB: 1
    envVars:
      - key: LOJINHA_MODE
        value: production
      - key: LOJINHA_DATA
        value: /var/data/lojinha
      - key: TZ
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: LOJINHA_ADMIN_USER
        value: tiago
      - key: LOJINHA_ADMIN_PASSWORD_HASH
        sync: false

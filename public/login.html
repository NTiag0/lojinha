<body class="loginpage"><main class="loginbox panel"><a class="brand loginbrand" href="/login"><span class="brandmark">L</span><span>Lojinha<small>MEU NEGÓCIO, EM DIA</small></span></a><h1>Entre na sua loja</h1><p class="subtitle">Use seu acesso para consultar e gerenciar o negócio.</p><form id="loginform"><label class="field"><span>Usuário</span><input id="username" name="username" autocomplete="username" required maxlength="100" autofocus></label><label class="field"><span>Senha</span><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><p class="formerror" id="loginerror" role="alert"></p><button class="primary" type="submit">Entrar</button></form><p class="filehint">Acesso restrito ao responsável pela loja.</p></main><script type="module" src="/login.js"></script></body></html>
